---
name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
  push:
    branches:
      - gh-action

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-latest
            artifact: tcpscan-windows-amd64.exe
          - platform: linux-amd64
            os: ubuntu-latest
            artifact: tcpscan-linux-amd64
          - platform: linux-arm
            os: ubuntu-latest
            artifact: tcpscan-linux-arm
            docker_platform: linux/arm/v7
            docker_image: python:3.12-slim
          - platform: linux-arm64
            os: ubuntu-latest
            artifact: tcpscan-linux-arm64
            docker_platform: linux/arm64
            docker_image: python:3.12-slim
          - platform: linux-ppc64le
            os: ubuntu-latest
            artifact: tcpscan-linux-ppc64le
            docker_platform: linux/ppc64le
            docker_image: python:3.12-slim

    steps:
      - uses: actions/checkout@v4
      
      # For non-Docker builds (Windows and Linux AMD64)
      - name: Set up Python
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (non-Docker)
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        run: pip install pyinstaller

      - name: Build executable (non-Docker)
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        run: pyinstaller -F --noupx tcpscan.py

      # For Docker builds (ARM and PPC64LE)
      - name: Set up QEMU
        if: contains(matrix.platform, 'arm') || matrix.platform == 'linux-ppc64le'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,ppc64le

      - name: Build executable (Docker)
        if: contains(matrix.platform, 'arm') || matrix.platform == 'linux-ppc64le'
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v ${{ github.workspace }}:/workspace \
            ${{ matrix.docker_image }} \
            /bin/bash -c "cd /workspace && \
            apt-get update && \
            apt-get install -y build-essential && \
            pip install pyinstaller && \
            pyinstaller -F --noupx tcpscan.py && \
            chown -R $(id -u):$(id -g) dist/"

      # Testing executables
      - name: Test executable (AMD64)
        if: matrix.platform == 'windows-amd64' || matrix.platform == 'linux-amd64'
        run: |
          if [ "${{ matrix.platform }}" == "windows-amd64" ]; then
            ./dist/tcpscan.exe --help
          else
            chmod +x ./dist/tcpscan
            ./dist/tcpscan --help
          fi
        shell: bash

      # Rename artifacts
      - name: Rename artifacts for release
        run: |
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv tcpscan.exe ${{ matrix.artifact }}
          else
            mv tcpscan ${{ matrix.artifact }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}
