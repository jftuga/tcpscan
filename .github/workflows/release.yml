---
name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
  push:
    branches:
      - gh-action

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-latest
            artifact_name: tcpscan-windows-amd64
          - platform: linux-amd64
            os: ubuntu-latest
            artifact_name: tcpscan-linux-amd64
          - platform: linux-arm
            os: ubuntu-latest
            artifact_name: tcpscan-linux-arm
            docker_platform: linux/arm/v7
            docker_image: python:3.12-slim
          - platform: linux-arm64
            os: ubuntu-latest
            artifact_name: tcpscan-linux-arm64
            docker_platform: linux/arm64
            docker_image: python:3.12-slim
          - platform: linux-ppc64le
            os: ubuntu-latest
            artifact_name: tcpscan-linux-ppc64le
            docker_platform: linux/ppc64le
            docker_image: python:3.12-slim

    steps:
      - uses: actions/checkout@v4
      
      # For non-Docker builds (Windows and Linux AMD64)
      - name: Set up Python
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (non-Docker)
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        run: pip install pyinstaller

      - name: Build executable (non-Docker)
        if: "!contains(matrix.platform, 'arm') && matrix.platform != 'linux-ppc64le'"
        run: pyinstaller -F --noupx tcpscan.py

      # For Docker builds (ARM and PPC64LE)
      - name: Set up QEMU
        if: contains(matrix.platform, 'arm') || matrix.platform == 'linux-ppc64le'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,ppc64le

      - name: Build executable (Docker)
        if: contains(matrix.platform, 'arm') || matrix.platform == 'linux-ppc64le'
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v ${{ github.workspace }}:/workspace \
            ${{ matrix.docker_image }} \
            /bin/bash -c "cd /workspace && \
            apt-get update && \
            apt-get install -y build-essential zlib1g-dev && \
            pip install pyinstaller && \
            pyinstaller -F --noupx tcpscan.py && \
            chown -R $(id -u):$(id -g) dist/"

      # Testing executables
      - name: Test executable
        run: |
          if [ "${{ matrix.platform }}" == "windows-amd64" ]; then
            ./dist/tcpscan.exe --help
          else
            chmod +x ./dist/tcpscan
            ./dist/tcpscan --help
          fi
        shell: bash

      # Get version from input or latest tag
      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Prepare release artifacts
      - name: Prepare artifacts for release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          RELEASE_DIR="tcpscan-${VERSION}"
          mkdir -p "dist/${RELEASE_DIR}"
          cp README.md "dist/${RELEASE_DIR}/"
          
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/tcpscan.exe "dist/${RELEASE_DIR}/tcpscan.exe"
            cd dist
            zip -r "${{ matrix.artifact_name }}-${VERSION}.zip" "${RELEASE_DIR}"
          else
            mv dist/tcpscan "dist/${RELEASE_DIR}/tcpscan"
            cd dist
            tar -cJf "${{ matrix.artifact_name }}-${VERSION}.tar.xz" "${RELEASE_DIR}"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/${{ matrix.artifact_name }}-${{ steps.get_version.outputs.version }}.zip
            dist/${{ matrix.artifact_name }}-${{ steps.get_version.outputs.version }}.tar.xz
